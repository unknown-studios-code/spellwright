# This workflow validates C# code formatting using dotnet format.
# It runs on pull requests and pushes to master/develop branches when C# files are modified.
# The workflow checks formatting without making changes and provides guidance if issues are found.

name: C# Lint

on:
  pull_request:
    paths:
      - "**.cs"
      - "**.csproj"
      - ".editorconfig"
  push:
    branches:
      - master
      - develop
    paths:
      - "**.cs"
      - "**.csproj"
      - ".editorconfig"

permissions:
  contents: read

jobs:
  dotnet-format:
    name: Check C# Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore tools
        run: dotnet tool restore || dotnet tool install -g dotnet-format

      - name: Restore dependencies
        run: dotnet restore || echo "Restore completed with warnings"

      - name: Run dotnet format (check only)
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: false

      - name: Format Check Summary
        if: failure()
        run: |
          echo "❌ Code formatting issues detected!"
          echo ""
          echo "To fix locally, run:"
          echo "  dotnet format"
          echo ""
          echo "Then commit the changes."
